<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Domino Editor V5 Physics</title><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script><style>body{margin:0;background:#202020;color:white;font-family:Arial;overflow:hidden}#ui{position:fixed;top:10px;left:10px;z-index:5}button{padding:7px;margin:2px}canvas{background:#333}</style></head><body><div id="ui"><button onclick="add()">添加物理牌</button><button onclick="push()">推动</button><button onclick="clearAll()">清空</button><br>V5 真实物理基础：碰撞 / 重力 / 摩擦</div><canvas id="c"></canvas><script>
const {Engine,Render,Runner,Bodies,Composite,Body}=Matter;
const engine=Engine.create();
const canvas=document.getElementById('c');
canvas.width=innerWidth;canvas.height=innerHeight;
const render=Render.create({canvas,engine,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#333'}});
Render.run(render);
Runner.run(Runner.create(),engine);
let dominos=[];
Composite.add(engine.world,Bodies.rectangle(innerWidth/2,innerHeight-40,innerWidth,40,{isStatic:true}));
function add(){let d=Bodies.rectangle(300+dominos.length*35,400,20,100,{density:.002,friction:.5,restitution:.1});dominos.push(d);Composite.add(engine.world,d)}
function push(){if(dominos[0])Body.applyForce(dominos[0],dominos[0].position,{x:.03,y:0})}
function clearAll(){dominos.forEach(d=>Composite.remove(engine.world,d));dominos=[]}
</script></body></html>
