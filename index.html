<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Editor V10</title><script src='https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js'></script><style>body{margin:0;background:#202020;color:white;font-family:Arial;overflow:hidden}#ui{position:fixed;top:10px;left:10px;background:#333;padding:12px;border-radius:8px;z-index:10}button{padding:8px;margin:3px}canvas{display:block}</style></head><body><div id='ui'><button onclick='addBall()'>球</button><button onclick='addDomino()'>多米诺</button><button onclick='addSwitch()'>开关</button><button onclick='addDoor()'>门</button><button onclick='addBomb()'>炸弹</button><button onclick='start()'>测试</button><button onclick='save()'>保存关卡</button><button onclick='load()'>读取</button><button onclick='clearAll()'>清空</button><br>V10 关卡系统：球→多米诺→机关</div><canvas id='c'></canvas><script>
const {Engine,Render,Runner,Bodies,Composite,Body,Events}=Matter;const c=document.getElementById('c');c.width=innerWidth;c.height=innerHeight;const engine=Engine.create();engine.gravity.y=1;const render=Render.create({canvas:c,engine,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#202020'}});Render.run(render);Runner.run(Runner.create(),engine);
let objs=[],running=false,goal=false;
Composite.add(engine.world,Bodies.rectangle(innerWidth/2,innerHeight-30,innerWidth,60,{isStatic:true}));
function add(type,x=300,y=300){let b;if(type==='ball')b=Bodies.circle(x,y,25,{density:.01,friction:.02});else if(type==='domino')b=Bodies.rectangle(x,y,18,90,{density:.004,friction:.8});else if(type==='switch')b=Bodies.rectangle(x,y,30,15,{isStatic:true});else if(type==='door')b=Bodies.rectangle(x,y,20,120,{isStatic:true});else b=Bodies.circle(x,y,20,{isStatic:true});b.plugin={type:type,activated:false};objs.push(b);Composite.add(engine.world,b)}
function addBall(){add('ball')}function addDomino(){add('domino',600+objs.length*25,350)}function addSwitch(){add('switch',900,350)}function addDoor(){add('door',1000,300)}function addBomb(){add('bomb',1100,300)}
Events.on(engine,'collisionStart',e=>{e.pairs.forEach(p=>{let a=p.bodyA,b=p.bodyB;if(a.plugin?.type==='domino'&&b.plugin?.type==='domino')fall(a,b);if(a.plugin?.type==='ball'&&b.plugin?.type==='domino')fall(b);if(b.plugin?.type==='ball'&&a.plugin?.type==='domino')fall(a);[a,b].forEach(o=>{if(o.plugin?.type==='switch'){o.plugin.activated=true;goal=true}})})});
function fall(...arr){arr.forEach(d=>{if(!d.plugin.activated){d.plugin.activated=true;Body.applyForce(d,d.position,{x:.03,y:0});Body.setAngularVelocity(d,.15)}})}
function start(){running=true;if(objs[0])Body.applyForce(objs[0],objs[0].position,{x:.03,y:0})}
function save(){localStorage.level10=JSON.stringify(objs.map(o=>({type:o.plugin.type,x:o.position.x,y:o.position.y,angle:o.angle})));alert('关卡保存成功')}
function load(){clearAll();let data=JSON.parse(localStorage.level10||'[]');data.forEach(o=>add(o.type,o.x,o.y))}
function clearAll(){objs.forEach(o=>Composite.remove(engine.world,o));objs=[];goal=false}
</script></body></html>
