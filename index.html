<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Editor V11</title><script src='https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js'></script><style>body{margin:0;background:#202020;color:white;font-family:Arial;overflow:hidden}#ui{position:fixed;top:10px;left:10px;background:#333;padding:12px;z-index:10;border-radius:8px}button{padding:7px;margin:2px}#info{position:fixed;right:10px;top:10px;background:#333;padding:12px}</style></head><body><div id='ui'><button onclick="add('ball')">球</button><button onclick="add('domino')">多米诺</button><button onclick="add('switch')">开关</button><button onclick="add('door')">门</button><button onclick="add('bomb')">炸弹</button><button onclick='test()'>物理测试</button><button onclick='edit()'>编辑模式</button><button onclick='save()'>保存</button><button onclick='load()'>读取</button><button onclick='clearAll()'>清空</button></div><div id='info'>V11<br>目标：触发开关打开机关<br><span id='state'>未完成</span></div><canvas id='c'></canvas><script>
const {Engine,Render,Runner,Bodies,Composite,Body,Events}=Matter;const c=document.getElementById('c');c.width=innerWidth;c.height=innerHeight;const engine=Engine.create();engine.gravity.y=1;const render=Render.create({canvas:c,engine,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#202020'}});Render.run(render);Runner.run(Runner.create(),engine);let objs=[],mode='edit';Composite.add(engine.world,Bodies.rectangle(innerWidth/2,innerHeight-30,innerWidth,60,{isStatic:true}));
function add(type,x=300+objs.length*35,y=300){let b;if(type==='ball')b=Bodies.circle(x,y,25,{density:.01,friction:.02});else if(type==='domino')b=Bodies.rectangle(x,y,18,90,{density:.004,friction:.8});else if(type==='bomb')b=Bodies.circle(x,y,22,{isStatic:true});else b=Bodies.rectangle(x,y,30,type==='door'?120:15,{isStatic:true});b.plugin={type,active:false};objs.push(b);Composite.add(engine.world,b)}
function test(){mode='test';if(objs[0])Body.applyForce(objs[0],objs[0].position,{x:.03,y:0})}function edit(){mode='edit'}
Events.on(engine,'collisionStart',e=>{e.pairs.forEach(p=>{let a=p.bodyA,b=p.bodyB;if(a.plugin?.type==='ball'&&b.plugin?.type==='domino')hit(b);if(b.plugin?.type==='ball'&&a.plugin?.type==='domino')hit(a);if(a.plugin?.type==='domino'&&b.plugin?.type==='domino'){hit(a);hit(b)}[a,b].forEach(o=>{if(o.plugin?.type==='switch'){o.plugin.active=true;document.getElementById('state').innerHTML='✅完成'}})})});
function hit(d){if(!d.plugin.active){d.plugin.active=true;Body.applyForce(d,d.position,{x:.025,y:0});Body.setAngularVelocity(d,.15)}}
function save(){localStorage.v11=JSON.stringify(objs.map(o=>({type:o.plugin.type,x:o.position.x,y:o.position.y,a:o.angle})))}function load(){clearAll();JSON.parse(localStorage.v11||'[]').forEach(o=>add(o.type,o.x,o.y))}function clearAll(){objs.forEach(o=>Composite.remove(engine.world,o));objs=[];document.getElementById('state').innerHTML='未完成'}
</script></body></html>
