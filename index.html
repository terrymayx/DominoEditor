<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Physics Creator V15</title><style>body{margin:0;background:#181818;color:white;font-family:Arial;overflow:hidden}#ui,#panel{position:fixed;z-index:5;background:#333;padding:12px;border-radius:8px}#ui{top:10px;left:10px}#panel{right:10px;top:10px}button{padding:6px;margin:2px}canvas{background:#222}</style></head><body><div id='ui'><b>物理机关创造平台 V15</b><br><button onclick="add('ball')">球</button><button onclick="add('domino')">多米诺</button><button onclick="add('switch')">开关</button><button onclick="add('door')">门</button><button onclick="add('bomb')">炸弹</button><br><button onclick="nodeMode()">逻辑连接</button><button onclick="editMode()">编辑</button><button onclick="run()">运行</button><button onclick="save()">保存</button></div><div id='panel'>节点逻辑系统<br><span id='msg'>编辑模式</span><br>连接: 点击两个节点<br>支持: AND / 延迟 / 计数扩展</div><canvas id='c'></canvas><script>let c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let objs=[],links=[],sel=-1,drag=0,mode='edit',start=-1;function add(t){objs.push({type:t,x:300+objs.length*50,y:300,state:false})}function hit(a,b){for(let i=objs.length-1;i>=0;i--)if(Math.abs(objs[i].x-a)<35&&Math.abs(objs[i].y-b)<50)return i;return -1}function col(t){return t=='ball'?'#59c':t=='switch'?'#5f5':t=='door'?'#f55':t=='bomb'?'#f90':'#eee'}function draw(){x.clearRect(0,0,c.width,c.height);links.forEach(l=>{x.strokeStyle='#0f0';x.beginPath();x.moveTo(l.a.x,l.a.y);x.lineTo(l.b.x,l.b.y);x.stroke()});objs.forEach((o,i)=>{x.fillStyle=i==sel?'#ffd43b':col(o.type);x.fillRect(o.x-18,o.y-35,36,70);x.fillStyle='#000';x.fillText(o.type,o.x-20,o.y+50)});requestAnimationFrame(draw)}draw();c.onmousedown=e=>{let i=hit(e.clientX,e.clientY);if(mode=='link'){if(i>=0){if(start<0){start=i;msg.innerHTML='选择触发目标'}else{links.push({a:objs[start],b:objs[i],type:'trigger'});start=-1;msg.innerHTML='连接完成'}}return}sel=i;drag=i>=0};c.onmousemove=e=>{if(drag&&sel>=0){objs[sel].x=e.clientX;objs[sel].y=e.clientY}};c.onmouseup=()=>drag=0;onkeydown=e=>{if(e.key=='Delete'&&sel>=0){objs.splice(sel,1);sel=-1}};function nodeMode(){mode='link';msg.innerHTML='逻辑连接模式'}function editMode(){mode='edit';msg.innerHTML='编辑模式'}function run(){msg.innerHTML='运行中:执行机关链';links.forEach((l,i)=>setTimeout(()=>l.b.state=true,i*500))}function save(){localStorage.v15=JSON.stringify({objects:objs,links:links.map(l=>[objs.indexOf(l.a),objs.indexOf(l.b)])});alert('V15保存完成')}function load(){let d=JSON.parse(localStorage.v15||'{}');objs=d.objects||[];links=(d.links||[]).map(a=>({a:objs[a[0]],b:objs[a[1]]}))}</script></body></html>
