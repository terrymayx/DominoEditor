<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Physics Mechanism Creator V17</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151b;color:#eef2f7;font-family:Arial,"Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none}.panel{position:fixed;z-index:10;background:rgba(24,29,38,.94);border:1px solid #3b4658;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28)}#toolbar{left:10px;top:10px;max-width:calc(100vw - 290px);padding:10px}#right{right:10px;top:10px;width:260px;padding:12px}#status{left:10px;bottom:10px;padding:8px 10px;font-size:12px;color:#c8d1df}.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:4px 0}button{border:1px solid #4a566b;background:#293140;color:#fff;border-radius:6px;padding:6px 9px;cursor:pointer}button:hover{background:#364258}button.primary{background:#2866d3}button.good{background:#267447}button.warn{background:#8a5b1b}button.danger{background:#7d3030}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#264c38;color:#c9ffdb;font-size:12px}.sep{width:1px;height:24px;background:#465063;margin:0 3px}.section{margin-top:10px;padding-top:10px;border-top:1px solid #3b4658}.section:first-child{margin-top:0;padding-top:0;border:0}h3{font-size:15px;margin:0 0 8px}.hint{font-size:12px;color:#aeb9ca;line-height:1.55}.field{display:grid;grid-template-columns:72px 1fr;gap:7px;align-items:center;margin:6px 0}.field input{width:100%;padding:5px 6px;border:1px solid #465063;border-radius:5px;background:#151a22;color:#fff}.field input[type=checkbox]{width:auto}.small{font-size:12px;color:#97a5b9}.hidden{display:none}
</style>
</head>
<body>
<div id="toolbar" class="panel">
  <div class="row"><span id="modeBadge" class="badge">编辑模式</span><b>物理机关创造平台 V17</b></div>
  <div class="row">
    <button data-add="ball">⚪ 球</button><button data-add="domino">▯ 多米诺</button><button data-add="box">□ 木箱</button><button data-add="ramp">／ 斜坡</button><button data-add="switch">● 开关</button><button data-add="door">▥ 门</button><button data-add="bomb">✹ 炸弹</button>
  </div>
  <div class="row">
    <button data-add="spring">〽 弹簧</button><button data-add="piston">⇥ 活塞</button><button data-add="conveyor">≫ 传送带</button><button data-add="fan">➤ 风场</button><span class="sep"></span><button data-node="delay">Delay</button><button data-node="and">AND</button>
  </div>
  <div class="row">
    <button id="editBtn">编辑</button><button id="connectBtn">连接蓝图</button><button id="runBtn" class="primary">▶ 运行</button><button id="stopBtn">■ 停止</button><button id="demoBtn" class="good">载入示例</button><span class="sep"></span><button id="saveBtn">保存</button><button id="loadBtn">读取</button><button id="exportBtn">导出 JSON</button><button id="importBtn">导入</button><input id="importFile" type="file" accept="application/json" class="hidden" />
  </div>
</div>

<div id="right" class="panel">
  <div class="section"><h3>蓝图 / 物理状态</h3><div id="message" class="hint">拖动物体进行布局；连接模式下依次点击源节点和目标节点。</div></div>
  <div class="section"><h3>选中对象</h3><div id="emptyProps" class="hint">点击场景对象或逻辑节点查看属性。</div><div id="props" class="hidden">
    <div class="field"><label>类型</label><span id="pType" class="small"></span></div>
    <div class="field"><label>X</label><input id="pX" type="number" /></div>
    <div class="field"><label>Y</label><input id="pY" type="number" /></div>
    <div class="field"><label>角度°</label><input id="pR" type="number" step="1" /></div>
    <div class="field" id="delayRow"><label>延迟ms</label><input id="pDelay" type="number" min="0" step="100" /></div>
    <div class="field" id="activeRow"><label>默认启用</label><input id="pActive" type="checkbox" /></div>
    <div class="row"><button id="applyBtn">应用</button><button id="dupBtn">复制</button><button id="deleteBtn" class="danger">删除</button></div>
  </div></div>
  <div class="section"><h3>V17 真实机关</h3><div class="hint">弹簧：接触后弹射<br>活塞：蓝图触发后往复推动<br>传送带：持续给物体切向力<br>风场：区域持续施力<br>炸弹：触发后径向爆炸<br>门：触发后变为可穿过</div></div>
</div>

<div id="status" class="panel">Delete 删除｜Ctrl+D 复制｜滚轮旋转｜运行时：真实碰撞 → 蓝图信号 → 机关动作</div>
<canvas id="c"></canvas>

<script>
const M=Matter,{Engine,Bodies,Body,Composite,Events,Query}=M;
const c=document.getElementById('c'),ctx=c.getContext('2d');
let dpr=1,mode='edit',entities=[],links=[],selectedId=null,dragging=false,dragOffset={x:0,y:0},linkStart=null;
let engine=null,ground=null,bodyById=new Map(),runtime=new Map(),lastT=performance.now(),nextId=1;
const COLORS={ball:'#58b7ff',domino:'#f1f1f1',box:'#c68b4b',ramp:'#8995a6',switch:'#60df79',door:'#ef5d63',bomb:'#ff9e3d',spring:'#d58cff',piston:'#62d4cf',conveyor:'#57a7ff',fan:'#65dfe7',delay:'#a76df0',and:'#d56fd8'};
const LABELS={ball:'球',domino:'多米诺',box:'木箱',ramp:'斜坡',switch:'开关',door:'门',bomb:'炸弹',spring:'弹簧',piston:'活塞',conveyor:'传送带',fan:'风场',delay:'Delay',and:'AND'};
function uid(){return 'e'+(nextId++)}
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',()=>{if(mode==='run')stopRun();resize()});resize();
function makeEntity(type,x=360,y=300){let e={id:uid(),kind:['delay','and'].includes(type)?'node':'object',type,x,y,r:0,defaultActive:false};if(type==='ball')Object.assign(e,{radius:24});if(type==='domino')Object.assign(e,{w:20,h:96});if(type==='box')Object.assign(e,{w:64,h:64});if(type==='ramp')Object.assign(e,{w:220,h:18,r:18});if(type==='switch')Object.assign(e,{w:58,h:16});if(type==='door')Object.assign(e,{w:24,h:125});if(type==='bomb')Object.assign(e,{radius:22});if(type==='spring')Object.assign(e,{w:70,h:18,defaultActive:true,power:.055});if(type==='piston')Object.assign(e,{w:75,h:26,defaultActive:false,stroke:80});if(type==='conveyor')Object.assign(e,{w:170,h:24,defaultActive:true,power:.0014});if(type==='fan')Object.assign(e,{w:190,h:100,defaultActive:true,power:.001});if(type==='delay')Object.assign(e,{w:118,h:58,delay:1000});if(type==='and')Object.assign(e,{w:118,h:58});return e}
function addEntity(type){if(mode==='run')return;let e=makeEntity(type,340+(entities.length%8)*42,250+(entities.length%3)*45);entities.push(e);selectedId=e.id;updateProps();setMessage('已添加：'+LABELS[type])}
function entity(id){return entities.find(e=>e.id===id)}
function drawGrid(){ctx.strokeStyle='#1d2530';ctx.lineWidth=1;for(let x=0;x<innerWidth;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke()}for(let y=0;y<innerHeight;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}}
function bezier(a,b,active=false){const dx=Math.max(70,Math.abs(b.x-a.x)*.45);ctx.strokeStyle=active?'#ffe26a':'#30df9b';ctx.lineWidth=active?4:2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(a.x+dx,a.y,b.x-dx,b.y,b.x,b.y);ctx.stroke();const ang=Math.atan2(b.y-a.y,b.x-a.x),s=8;ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.cos(ang-.5)*s,b.y-Math.sin(ang-.5)*s);ctx.lineTo(b.x-Math.cos(ang+.5)*s,b.y-Math.sin(ang+.5)*s);ctx.fill()}
function drawNode(e,sel,rt){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=rt?.active?'#ffe26a':COLORS[e.type];ctx.strokeStyle=sel?'#fff4a8':'#141820';ctx.lineWidth=sel?4:2;ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,9);ctx.fill();ctx.stroke();ctx.fillStyle='#10131a';ctx.font='bold 13px Arial';ctx.fillText(LABELS[e.type],-e.w/2+12,-4);ctx.font='11px Arial';ctx.fillText(e.type==='delay'?(e.delay+' ms'):'2 输入条件',-e.w/2+12,14);ctx.restore()}
function drawObject(e,sel,rt,body){const x=body?body.position.x:e.x,y=body?body.position.y:e.y,r=body?body.angle:e.r*Math.PI/180;ctx.save();ctx.translate(x,y);ctx.rotate(r);let active=rt?.active;ctx.fillStyle=active?'#ffe26a':COLORS[e.type];ctx.strokeStyle=sel?'#fff4a8':'#101319';ctx.lineWidth=sel?4:2;
 if(e.type==='ball'||e.type==='bomb'){ctx.beginPath();ctx.arc(0,0,e.radius,0,Math.PI*2);ctx.fill();ctx.stroke();if(e.type==='bomb'){ctx.fillStyle='#222';ctx.fillText('✹',-5,5)}}
 else if(e.type==='fan'){ctx.globalAlpha=active?.22:.14;ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);ctx.globalAlpha=1;ctx.strokeRect(-e.w/2,-e.h/2,e.w,e.h);ctx.fillStyle=COLORS.fan;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-55,i*25);ctx.lineTo(55,i*25);ctx.strokeStyle=COLORS.fan;ctx.stroke();ctx.beginPath();ctx.moveTo(55,i*25);ctx.lineTo(43,i*25-6);ctx.lineTo(43,i*25+6);ctx.fill()}}
 else if(e.type==='spring'){ctx.strokeStyle=COLORS.spring;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-e.w/2,7);for(let i=0;i<7;i++)ctx.lineTo(-e.w/2+(i+1)*e.w/7,(i%2?8:-8));ctx.stroke();ctx.strokeRect(-e.w/2,-e.h/2,e.w,e.h)}
 else if(e.type==='conveyor'){ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);ctx.strokeRect(-e.w/2,-e.h/2,e.w,e.h);ctx.fillStyle='#142032';for(let i=-60;i<=60;i+=30)ctx.fillText('›',i,5)}
 else{ctx.beginPath();ctx.roundRect(-e.w/2,-e.h/2,e.w,e.h,5);if(e.type==='door'&&active){ctx.globalAlpha=.22;ctx.fill();ctx.globalAlpha=1;ctx.setLineDash([6,5]);ctx.stroke()}else{ctx.fill();ctx.stroke()}ctx.setLineDash([])}ctx.restore();if(mode!=='run'){ctx.fillStyle='#8f9bad';ctx.font='11px Arial';ctx.fillText(LABELS[e.type],e.x-24,e.y+(e.h?e.h/2:30)+16)}}
function render(){ctx.clearRect(0,0,innerWidth,innerHeight);drawGrid();ctx.fillStyle='#343b47';ctx.fillRect(0,innerHeight-30,innerWidth,30);links.forEach(l=>{const a=entity(l.from),b=entity(l.to);if(a&&b)bezier(a,b,runtime.get(l.from)?.active&&runtime.get(l.to)?.active)});entities.forEach(e=>{const rt=runtime.get(e.id);if(e.kind==='node')drawNode(e,e.id===selectedId,rt);else drawObject(e,e.id===selectedId,rt,bodyById.get(e.id))});if(mode==='connect'&&linkStart){const a=entity(linkStart);if(a){ctx.strokeStyle='#ffe26a';ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(pointer.x,pointer.y);ctx.stroke();ctx.setLineDash([])}}requestAnimationFrame(render)}requestAnimationFrame(render);
function hit(x,y){for(let i=entities.length-1;i>=0;i--){const e=entities[i],hw=(e.w||e.radius*2||60)/2,hh=(e.h||e.radius*2||60)/2;if(Math.abs(e.x-x)<=hw+8&&Math.abs(e.y-y)<=hh+8)return e}return null}
const pointer={x:0,y:0};c.addEventListener('pointerdown',ev=>{pointer.x=ev.clientX;pointer.y=ev.clientY;if(mode==='run')return;const h=hit(ev.clientX,ev.clientY);if(mode==='connect'){if(!h)return;if(!linkStart){linkStart=h.id;selectedId=h.id;setMessage('已选择源：'+LABELS[h.type]+'，请点击目标')}else{if(linkStart!==h.id&&!links.some(l=>l.from===linkStart&&l.to===h.id))links.push({from:linkStart,to:h.id,type:'signal'});linkStart=null;selectedId=h.id;setMessage('蓝图连接完成')}updateProps();return}selectedId=h?.id||null;if(h){dragging=true;dragOffset={x:ev.clientX-h.x,y:ev.clientY-h.y};c.setPointerCapture(ev.pointerId)}updateProps()});
c.addEventListener('pointermove',ev=>{pointer.x=ev.clientX;pointer.y=ev.clientY;if(mode!=='edit'||!dragging||!selectedId)return;const e=entity(selectedId);if(e){e.x=Math.round((ev.clientX-dragOffset.x)/5)*5;e.y=Math.round((ev.clientY-dragOffset.y)/5)*5;updateProps()}});c.addEventListener('pointerup',()=>dragging=false);c.addEventListener('wheel',ev=>{if(mode!=='edit'||!selectedId)return;const e=entity(selectedId);if(e&&e.kind==='object'){ev.preventDefault();e.r+=(ev.deltaY>0?5:-5);updateProps()}},{passive:false});
addEventListener('keydown',ev=>{if(mode==='run')return;if(ev.key==='Delete')removeSelected();if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='d'){ev.preventDefault();duplicateSelected()}});
function updateProps(){const e=entity(selectedId),box=document.getElementById('props'),empty=document.getElementById('emptyProps');if(!e){box.classList.add('hidden');empty.classList.remove('hidden');return}box.classList.remove('hidden');empty.classList.add('hidden');pType.textContent=(e.kind==='node'?'逻辑节点 · ':'物理对象 · ')+LABELS[e.type];pX.value=Math.round(e.x);pY.value=Math.round(e.y);pR.value=Math.round(e.r||0);pR.disabled=e.kind==='node';delayRow.style.display=e.type==='delay'?'grid':'none';pDelay.value=e.delay||1000;activeRow.style.display=e.kind==='object'&&!['ball','domino','box','ramp','switch'].includes(e.type)?'grid':'none';pActive.checked=!!e.defaultActive}
function applyProps(){const e=entity(selectedId);if(!e)return;e.x=Number(pX.value)||0;e.y=Number(pY.value)||0;if(e.kind==='object')e.r=Number(pR.value)||0;if(e.type==='delay')e.delay=Math.max(0,Number(pDelay.value)||0);if(e.kind==='object')e.defaultActive=!!pActive.checked;setMessage('属性已应用')}
function duplicateSelected(){const e=entity(selectedId);if(!e||mode==='run')return;const n=JSON.parse(JSON.stringify(e));n.id=uid();n.x+=35;n.y+=25;entities.push(n);selectedId=n.id;updateProps()}
function removeSelected(){if(!selectedId||mode==='run')return;entities=entities.filter(e=>e.id!==selectedId);links=links.filter(l=>l.from!==selectedId&&l.to!==selectedId);selectedId=null;updateProps()}
function setMode(m){if(mode==='run'&&m!=='run')stopRun();mode=m;modeBadge.textContent=m==='edit'?'编辑模式':m==='connect'?'蓝图连接':'运行模式';modeBadge.style.background=m==='run'?'#71393b':m==='connect'?'#5b4520':'#264c38';if(m!=='connect')linkStart=null}
function setMessage(t){message.textContent=t}
function createBody(e){const a=e.r*Math.PI/180;let b;if(e.type==='ball')b=Bodies.circle(e.x,e.y,e.radius,{density:.008,friction:.025,frictionStatic:.45,frictionAir:.0007,restitution:.04});else if(e.type==='domino')b=Bodies.rectangle(e.x,e.y,e.w,e.h,{angle:a,density:.0035,friction:.7,frictionStatic:.8,restitution:.015});else if(e.type==='box')b=Bodies.rectangle(e.x,e.y,e.w,e.h,{angle:a,density:.004,friction:.6,restitution:.04});else if(e.type==='ramp'||e.type==='conveyor'||e.type==='piston'||e.type==='spring'||e.type==='door')b=Bodies.rectangle(e.x,e.y,e.w,e.h,{angle:a,isStatic:true,isSensor:e.type==='spring',friction:e.type==='ramp'?.85:.5});else if(e.type==='switch')b=Bodies.rectangle(e.x,e.y,e.w,e.h,{angle:a,isStatic:true,isSensor:true});else if(e.type==='bomb')b=Bodies.circle(e.x,e.y,e.radius,{isStatic:true,isSensor:true});else if(e.type==='fan')b=Bodies.rectangle(e.x,e.y,e.w,e.h,{angle:a,isStatic:true,isSensor:true});if(b){b.plugin={entityId:e.id,type:e.type};return b}return null}
function startRun(){if(mode==='run')return;setMode('run');setMessage('运行中：真实碰撞正在驱动蓝图信号');runtime=new Map();bodyById=new Map();engine=Engine.create({enableSleeping:true});engine.gravity.y=1;ground=Bodies.rectangle(innerWidth/2,innerHeight-15,innerWidth+300,30,{isStatic:true,friction:1});Composite.add(engine.world,ground);entities.forEach(e=>{runtime.set(e.id,{active:!!e.defaultActive,inputs:new Set(),fired:false,exploded:false});if(e.kind==='object'){const b=createBody(e);if(b){bodyById.set(e.id,b);Composite.add(engine.world,b)}}});Events.on(engine,'collisionStart',handleCollisions);entities.filter(e=>e.kind==='object'&&e.defaultActive).forEach(e=>activate(e.id,'startup'));lastT=performance.now()}
function stopRun(){mode='edit';engine=null;ground=null;bodyById.clear();runtime.clear();modeBadge.textContent='编辑模式';modeBadge.style.background='#264c38';setMessage('已停止，返回原始编辑布局')}
function handleCollisions(ev){ev.pairs.forEach(p=>{const ba=p.bodyA,bb=p.bodyB,ia=ba.plugin?.entityId,ib=bb.plugin?.entityId,ea=entity(ia),eb=entity(ib);if(ea?.type==='switch'&&!bb.isStatic)activate(ea.id,ib);if(eb?.type==='switch'&&!ba.isStatic)activate(eb.id,ia);if(ea?.type==='spring'&&!bb.isStatic)springKick(ea,bb);if(eb?.type==='spring'&&!ba.isStatic)springKick(eb,ba);if(ea?.type==='bomb'&&!bb.isStatic)activate(ea.id,ib);if(eb?.type==='bomb'&&!ba.isStatic)activate(eb.id,ia);if(ea?.type==='domino'&&eb?.type==='domino'){markPhysicalTrigger(ea.id,eb.id);markPhysicalTrigger(eb.id,ea.id)}if(ea?.type==='ball'&&eb?.type==='domino')markPhysicalTrigger(eb.id,ea.id);if(eb?.type==='ball'&&ea?.type==='domino')markPhysicalTrigger(ea.id,eb.id)})}
function markPhysicalTrigger(id,from){const rt=runtime.get(id);if(rt&&!rt.fired){rt.fired=true;emit(id);setMessage('物理碰撞触发：'+LABELS[entity(id).type])}}
function springKick(e,b){const rt=runtime.get(e.id);if(!rt?.active)return;const a=e.r*Math.PI/180,n={x:-Math.sin(a),y:-Math.cos(a)},power=e.power||.055;Body.applyForce(b,b.position,{x:n.x*power*b.mass,y:n.y*power*b.mass});Body.setAngularVelocity(b,b.angularVelocity+.05);markPhysicalTrigger(e.id,b.plugin?.entityId)}
function activate(id,from){const e=entity(id),rt=runtime.get(id);if(!e||!rt||mode!=='run')return;if(e.kind==='node'){if(e.type==='delay'){if(rt.fired)return;rt.active=true;rt.fired=true;setMessage('Delay '+e.delay+'ms');setTimeout(()=>{if(mode==='run'){emit(id)}},e.delay||1000)}else if(e.type==='and'){rt.inputs.add(from||'signal');rt.active=true;if(rt.inputs.size>=2&&!rt.fired){rt.fired=true;setMessage('AND 条件满足');emit(id)}}return}
 if(e.type==='door'){rt.active=true;const b=bodyById.get(id);if(b)b.isSensor=true}else if(e.type==='bomb'){if(rt.exploded)return;rt.active=true;rt.exploded=true;explode(e)}else{rt.active=true}if(!rt.fired){rt.fired=true;emit(id)} }
function emit(from){links.filter(l=>l.from===from).forEach(l=>activate(l.to,from))}
function explode(e){const b0=bodyById.get(e.id);if(!b0)return;const radius=180;for(const [id,b] of bodyById){if(b.isStatic||id===e.id)continue;const dx=b.position.x-b0.position.x,dy=b.position.y-b0.position.y,d=Math.hypot(dx,dy);if(d>0&&d<radius){const k=(1-d/radius)*.035*b.mass;Body.applyForce(b,b.position,{x:dx/d*k,y:dy/d*k})}}setMessage('炸弹已触发：产生径向冲击')}
function updateMechanisms(t){if(mode!=='run'||!engine)return;const dynamics=[...bodyById.values()].filter(b=>!b.isStatic);for(const e of entities){if(e.kind!=='object')continue;const rt=runtime.get(e.id),b=bodyById.get(e.id);if(!rt||!b||!rt.active)continue;const a=e.r*Math.PI/180;if(e.type==='conveyor'){const hits=Query.region(dynamics,b.bounds);const dir={x:Math.cos(a),y:Math.sin(a)};hits.forEach(o=>Body.applyForce(o,o.position,{x:dir.x*(e.power||.0014)*o.mass,y:dir.y*(e.power||.0014)*o.mass}))}else if(e.type==='fan'){const hits=Query.region(dynamics,b.bounds);const dir={x:Math.cos(a),y:Math.sin(a)};hits.forEach(o=>Body.applyForce(o,o.position,{x:dir.x*(e.power||.001)*o.mass,y:dir.y*(e.power||.001)*o.mass}))}else if(e.type==='piston'){const s=e.stroke||80,phase=(Math.sin(t*.004)+1)/2,dir={x:Math.cos(a),y:Math.sin(a)};Body.setPosition(b,{x:e.x+dir.x*s*phase,y:e.y+dir.y*s*phase},true)}}}
function physicsLoop(t){if(mode==='run'&&engine){const dt=Math.min(32,Math.max(8,t-lastT));lastT=t;updateMechanisms(t);Engine.update(engine,dt)}requestAnimationFrame(physicsLoop)}requestAnimationFrame(physicsLoop);
function saveLevel(){localStorage.setItem('physicsCreatorV17',JSON.stringify(serialized()));setMessage('已保存到浏览器')}
function loadLevel(){if(mode==='run')stopRun();const raw=localStorage.getItem('physicsCreatorV17');if(!raw){setMessage('没有找到 V17 存档');return}try{applyData(JSON.parse(raw));setMessage('存档读取完成')}catch(e){setMessage('存档格式错误')}}
function serialized(){return{version:17,nextId,entities:entities.map(e=>({...e})),links:links.map(l=>({...l}))}}
function applyData(d){entities=(d.entities||[]).map(e=>({...e}));links=(d.links||[]).filter(l=>entity(l.from)&&entity(l.to));nextId=Math.max(d.nextId||1,...entities.map(e=>Number((e.id||'e0').replace(/\D/g,''))+1),1);selectedId=null;updateProps()}
function exportLevel(){const blob=new Blob([JSON.stringify(serialized(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='physics-mechanism-v17.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importLevel(file){const r=new FileReader();r.onload=()=>{try{if(mode==='run')stopRun();applyData(JSON.parse(r.result));setMessage('JSON 导入完成')}catch(e){setMessage('JSON 导入失败')}};r.readAsText(file)}
function loadDemo(){if(mode==='run')stopRun();entities=[];links=[];nextId=1;const H=innerHeight;
 const ramp=makeEntity('ramp',285,H-185);ramp.r=18;entities.push(ramp);const ball=makeEntity('ball',170,H-285);entities.push(ball);for(let i=0;i<8;i++){const d=makeEntity('domino',480+i*34,H-78);entities.push(d)}const sw=makeEntity('switch',780,H-42);entities.push(sw);const delay=makeEntity('delay',850,H-220);delay.delay=800;entities.push(delay);const piston=makeEntity('piston',980,H-78);entities.push(piston);const conveyor=makeEntity('conveyor',1130,H-47);entities.push(conveyor);const door=makeEntity('door',1280,H-92);entities.push(door);const fan=makeEntity('fan',1040,H-230);fan.defaultActive=true;entities.push(fan);const spring=makeEntity('spring',900,H-44);spring.defaultActive=true;entities.push(spring);const bomb=makeEntity('bomb',1220,H-55);entities.push(bomb);
 links.push({from:sw.id,to:delay.id,type:'signal'},{from:delay.id,to:piston.id,type:'signal'},{from:delay.id,to:door.id,type:'signal'},{from:delay.id,to:bomb.id,type:'signal'});selectedId=null;updateProps();setMessage('V17 示例已载入：球→多米诺→开关→Delay→活塞/门/炸弹')}

document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>addEntity(b.dataset.add)));document.querySelectorAll('[data-node]').forEach(b=>b.addEventListener('click',()=>addEntity(b.dataset.node)));editBtn.addEventListener('click',()=>{setMode('edit');setMessage('编辑模式')});connectBtn.addEventListener('click',()=>{if(mode==='run')stopRun();setMode('connect');setMessage('蓝图连接：先点源，再点目标')});runBtn.addEventListener('click',startRun);stopBtn.addEventListener('click',stopRun);demoBtn.addEventListener('click',loadDemo);saveBtn.addEventListener('click',saveLevel);loadBtn.addEventListener('click',loadLevel);exportBtn.addEventListener('click',exportLevel);importBtn.addEventListener('click',()=>importFile.click());importFile.addEventListener('change',()=>{if(importFile.files[0])importLevel(importFile.files[0]);importFile.value=''});applyBtn.addEventListener('click',applyProps);dupBtn.addEventListener('click',duplicateSelected);deleteBtn.addEventListener('click',removeSelected);
loadDemo();
