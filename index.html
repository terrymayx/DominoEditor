<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Physics Creator V16</title><style>body{margin:0;background:#151515;color:white;font-family:Arial;overflow:hidden}#ui,#panel{position:fixed;z-index:5;background:#303030;padding:12px;border-radius:8px}#ui{top:10px;left:10px}#panel{right:10px;top:10px}button{padding:6px;margin:2px}canvas{background:#202020}</style></head><body><div id='ui'><b>物理机关创造平台 V16</b><br><button onclick="addObj('ball')">球</button><button onclick="addObj('domino')">多米诺</button><button onclick="addObj('switch')">开关</button><button onclick="addObj('door')">门</button><button onclick="addNode('delay')">延迟节点</button><button onclick="addNode('and')">AND节点</button><br><button onclick="connect()">连接节点</button><button onclick="run()">运行</button><button onclick="save()">保存</button></div><div id='panel'>V16 可视化蓝图系统<br><span id='msg'>编辑模式</span><br>拖动物体<br>连接逻辑节点<br>支持: 触发 / 延迟 / AND</div><canvas id='c'></canvas><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let objs=[],nodes=[],links=[],sel=null,mode='edit',linkA=null;function addObj(t){objs.push({kind:'object',type:t,x:250+objs.length*50,y:300,state:false})}function addNode(t){nodes.push({kind:'node',type:t,x:400+nodes.length*100,y:150,state:false})}function draw(){ctx.clearRect(0,0,c.width,c.height);links.forEach(l=>{ctx.strokeStyle='#00ff88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l.a.x,l.a.y);ctx.lineTo(l.b.x,l.b.y);ctx.stroke()});[...objs,...nodes].forEach(o=>{ctx.fillStyle=o===sel?'#ffd43b':o.kind==='node'?'#aa55ff':o.type==='ball'?'#55aaff':o.type==='switch'?'#55ff55':o.type==='door'?'#ff5555':'#eee';ctx.fillRect(o.x-25,o.y-25,50,50);ctx.fillStyle='#000';ctx.fillText(o.type,o.x-20,o.y+5)});requestAnimationFrame(draw)}draw();function hit(x,y){let all=[...objs,...nodes];return all.find(o=>Math.abs(o.x-x)<35&&Math.abs(o.y-y)<35)}c.onmousedown=e=>{let h=hit(e.clientX,e.clientY);if(mode==='connect'){if(h){if(!linkA){linkA=h;msg.innerHTML='选择目标节点'}else{links.push({a:linkA,b:h,type:'trigger'});linkA=null;msg.innerHTML='连接完成'}}return}sel=h};c.onmousemove=e=>{if(sel&&mode==='edit'&&e.buttons){sel.x=e.clientX;sel.y=e.clientY}};function connect(){mode='connect';msg.innerHTML='连接模式'}function run(){msg.innerHTML='蓝图运行中';let active=objs.find(o=>o.type==='ball');links.forEach((l,i)=>setTimeout(()=>l.b.state=true,i*600))}function save(){localStorage.v16=JSON.stringify({objects:objs,nodes:nodes,links:links.map(l=>[l.a,l.b])});alert('V16蓝图保存完成')}</script></body></html>
