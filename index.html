<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Editor V12</title><script src='https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js'></script><style>body{margin:0;background:#202020;color:white;font-family:Arial;overflow:hidden}#ui{position:fixed;top:10px;left:10px;background:#333;padding:10px;z-index:5;border-radius:8px}button{padding:7px;margin:2px}#panel{position:fixed;right:10px;top:10px;background:#333;padding:12px;border-radius:8px}</style></head><body><div id='ui'><button onclick="add('ball')">球</button><button onclick="add('domino')">多米诺</button><button onclick="add('switch')">开关</button><button onclick="add('door')">门</button><button onclick="add('bomb')">炸弹</button><button onclick='test()'>测试</button><button onclick='edit()'>编辑</button><button onclick='save()'>保存</button><button onclick='load()'>读取</button><button onclick='clearAll()'>清空</button></div><div id='panel'>V12 关卡编辑器<br><span id='msg'>编辑模式</span><br>拖动对象 | Delete删除 | 滚轮旋转</div><canvas id='c'></canvas><script>
const {Engine,Render,Runner,Bodies,Composite,Body,Events}=Matter;const c=document.getElementById('c');c.width=innerWidth;c.height=innerHeight;const engine=Engine.create();engine.gravity.y=1;Render.run(Render.create({canvas:c,engine,options:{width:innerWidth,height:innerHeight,wireframes:false,background:'#202020'}}));Runner.run(Runner.create(),engine);
let objs=[],mode='edit',sel=null,drag=false;
Composite.add(engine.world,Bodies.rectangle(innerWidth/2,innerHeight-30,innerWidth,60,{isStatic:true}));
function add(type,x=300+objs.length*40,y=250){let b;if(type==='ball')b=Bodies.circle(x,y,25,{density:.01,friction:.02});else if(type==='domino')b=Bodies.rectangle(x,y,18,90,{density:.004,friction:.8});else if(type==='bomb')b=Bodies.circle(x,y,22,{isStatic:true});else b=Bodies.rectangle(x,y,type==='door'?25:35,type==='door'?120:15,{isStatic:true});b.plugin={type,active:false};objs.push(b);Composite.add(engine.world,b)}
function hit(x,y){return objs.find(o=>Math.hypot(o.position.x-x,o.position.y-y)<50)}
c.onmousedown=e=>{if(mode!=='edit')return;sel=hit(e.clientX,e.clientY);drag=!!sel};c.onmousemove=e=>{if(drag&&sel){Body.setPosition(sel,{x:e.clientX,y:e.clientY})}};c.onmouseup=()=>drag=false;c.onwheel=e=>{if(sel)Body.setAngle(sel,sel.angle+(e.deltaY>0?.1:-.1))};document.onkeydown=e=>{if(e.key==='Delete'&&sel){Composite.remove(engine.world,sel);objs.splice(objs.indexOf(sel),1);sel=null}};
function test(){mode='test';document.getElementById('msg').innerHTML='物理测试模式';if(objs[0])Body.applyForce(objs[0],objs[0].position,{x:.03,y:0})}function edit(){mode='edit';document.getElementById('msg').innerHTML='编辑模式'}
Events.on(engine,'collisionStart',e=>e.pairs.forEach(p=>{let a=p.bodyA,b=p.bodyB;if(a.plugin?.type==='ball'&&b.plugin?.type==='domino')fall(b);if(b.plugin?.type==='ball'&&a.plugin?.type==='domino')fall(a);if(a.plugin?.type==='domino'&&b.plugin?.type==='domino'){fall(a);fall(b)}}));function fall(d){if(!d.plugin.active){d.plugin.active=true;Body.setAngularVelocity(d,.15)}}
function save(){localStorage.v12=JSON.stringify(objs.map(o=>({type:o.plugin.type,x:o.position.x,y:o.position.y,a:o.angle})))}function load(){clearAll();JSON.parse(localStorage.v12||'[]').forEach(o=>add(o.type,o.x,o.y))}function clearAll(){objs.forEach(o=>Composite.remove(engine.world,o));objs=[]}
</script></body></html>
