<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Domino Editor V6</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191d;color:#f4f4f4;font-family:Arial,"Microsoft YaHei",sans-serif}
  #toolbar{position:fixed;left:12px;top:12px;z-index:20;background:rgba(27,30,36,.94);padding:10px;border:1px solid #444;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #toolbar .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}
  button{border:1px solid #555;background:#2c313a;color:#fff;padding:7px 10px;border-radius:6px;cursor:pointer} button:hover{background:#3a414c} button.primary{background:#3468d4} button.danger{background:#8d3535}
  #modeBadge{padding:5px 9px;border-radius:999px;background:#244b2c;color:#caffd4;font-size:12px;font-weight:bold}
  #panel{position:fixed;right:12px;top:12px;z-index:20;width:235px;background:rgba(27,30,36,.94);padding:12px;border:1px solid #444;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #panel h3{margin:0 0 10px;font-size:16px}.field{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin:7px 0}.field input,.field select{width:100%;background:#17191d;border:1px solid #555;color:#fff;border-radius:5px;padding:6px}
  #help{position:fixed;left:12px;bottom:10px;z-index:20;color:#bbb;font-size:12px;background:rgba(20,20,20,.75);padding:7px 9px;border-radius:6px}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<div id="toolbar">
  <div class="row"><span id="modeBadge">编辑模式</span><strong>Domino Editor V6</strong></div>
  <div class="row">
    <button onclick="addObject('domino')">多米诺</button>
    <button onclick="addObject('ball')">球</button>
    <button onclick="addObject('box')">木箱</button>
    <button onclick="addObject('ramp')">斜坡</button>
  </div>
  <div class="row">
    <button class="primary" onclick="startTest()">▶ 物理测试</button>
    <button onclick="pushFirst()">推第一块</button>
    <button onclick="stopTest()">↩ 返回编辑</button>
  </div>
  <div class="row">
    <button onclick="saveLevel()">保存</button>
    <button onclick="loadLevel()">读取</button>
    <button onclick="exportLevel()">导出 JSON</button>
    <button class="danger" onclick="clearAll()">清空</button>
  </div>
</div>

<div id="panel">
  <h3>对象属性</h3>
  <div id="empty">点击对象进行编辑</div>
  <div id="props" style="display:none">
    <div class="field"><label>类型</label><select id="pType" disabled><option value="domino">多米诺</option><option value="ball">球</option><option value="box">木箱</option><option value="ramp">斜坡</option></select></div>
    <div class="field"><label>X</label><input id="pX" type="number" /></div>
    <div class="field"><label>Y</label><input id="pY" type="number" /></div>
    <div class="field"><label>角度°</label><input id="pR" type="number" step="1" /></div>
    <div class="field"><label>尺寸</label><input id="pSize" type="number" min="10" max="300" /></div>
    <button onclick="applyProps()">应用属性</button>
    <button onclick="duplicateSelected()">复制</button>
    <button class="danger" onclick="deleteSelected()">删除</button>
  </div>
</div>

<div id="help">编辑：拖动对象｜滚轮旋转｜Delete 删除｜Ctrl+D 复制｜测试模式中点击“推第一块”启动连锁</div>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let objects=[];
let selected=-1;
let dragging=false;
let dragOffset={x:0,y:0};
let mode='edit';
let engine=null;
let bodies=[];
let ground=null;

function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();

const COLORS={domino:'#f2f2f2',ball:'#60b8ff',box:'#c88b49',ramp:'#8f9aa8'};
function snap(v){return Math.round(v/10)*10}
function makeObject(type,x=360,y=360){
  if(type==='domino')return{type,x,y,r:0,w:22,h:100,size:100};
  if(type==='ball')return{type,x,y,r:0,radius:24,size:48};
  if(type==='box')return{type,x,y,r:0,w:70,h:70,size:70};
  return{type,x,y,r:-18,w:180,h:18,size:180};
}
function addObject(type){if(mode!=='edit')return;const o=makeObject(type,360+objects.length*8,360);objects.push(o);selected=objects.length-1;updatePanel()}

function drawGrid(){ctx.strokeStyle='#242832';ctx.lineWidth=1;for(let x=0;x<innerWidth;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke()}for(let y=0;y<innerHeight;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}}
function drawObject(o,highlight=false){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r*Math.PI/180);ctx.fillStyle=COLORS[o.type];ctx.strokeStyle=highlight?'#ffd34d':'#111';ctx.lineWidth=highlight?4:2;if(o.type==='ball'){ctx.beginPath();ctx.arc(0,0,o.radius,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.roundRect(-o.w/2,-o.h/2,o.w,o.h,5);ctx.fill();ctx.stroke();if(o.type==='domino'){ctx.fillStyle='#303030';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function drawBody(body,type,source){ctx.save();ctx.translate(body.position.x,body.position.y);ctx.rotate(body.angle);ctx.fillStyle=COLORS[type];ctx.strokeStyle='#111';ctx.lineWidth=2;if(type==='ball'){ctx.beginPath();ctx.arc(0,0,source.radius,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.roundRect(-source.w/2,-source.h/2,source.w,source.h,5);ctx.fill();ctx.stroke()}ctx.restore()}
function render(){ctx.clearRect(0,0,innerWidth,innerHeight);drawGrid();ctx.fillStyle='#464b55';ctx.fillRect(0,innerHeight-35,innerWidth,35);if(mode==='edit'){objects.forEach((o,i)=>drawObject(o,i===selected))}else{bodies.forEach((b,i)=>drawBody(b,objects[i].type,objects[i]))}requestAnimationFrame(render)}
requestAnimationFrame(render);

function localPoint(o,x,y){const a=-o.r*Math.PI/180,dx=x-o.x,dy=y-o.y;return{x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a)}}
function hitObject(x,y){for(let i=objects.length-1;i>=0;i--){const o=objects[i],p=localPoint(o,x,y);if(o.type==='ball'){if(p.x*p.x+p.y*p.y<=o.radius*o.radius)return i}else if(Math.abs(p.x)<=o.w/2+6&&Math.abs(p.y)<=o.h/2+6)return i}return-1}
canvas.addEventListener('pointerdown',e=>{if(mode!=='edit')return;selected=hitObject(e.clientX,e.clientY);if(selected>=0){dragging=true;dragOffset.x=e.clientX-objects[selected].x;dragOffset.y=e.clientY-objects[selected].y;canvas.setPointerCapture(e.pointerId)}updatePanel()});
canvas.addEventListener('pointermove',e=>{if(mode!=='edit'||!dragging||selected<0)return;const o=objects[selected];o.x=snap(e.clientX-dragOffset.x);o.y=snap(e.clientY-dragOffset.y);updatePanel()});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('wheel',e=>{if(mode!=='edit'||selected<0)return;e.preventDefault();objects[selected].r+=(e.deltaY>0?5:-5);updatePanel()},{passive:false});
addEventListener('keydown',e=>{if(mode!=='edit')return;if(e.key==='Delete')deleteSelected();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelected()}});

function updatePanel(){const p=document.getElementById('props'),empty=document.getElementById('empty');if(selected<0||!objects[selected]){p.style.display='none';empty.style.display='block';return}const o=objects[selected];empty.style.display='none';p.style.display='block';pType.value=o.type;pX.value=Math.round(o.x);pY.value=Math.round(o.y);pR.value=Math.round(o.r);pSize.value=o.size}
function applyProps(){if(mode!=='edit'||selected<0)return;const o=objects[selected];o.x=Number(pX.value)||0;o.y=Number(pY.value)||0;o.r=Number(pR.value)||0;const s=Math.max(10,Number(pSize.value)||o.size);o.size=s;if(o.type==='domino')o.h=s;if(o.type==='ball'){o.radius=s/2}else if(o.type==='box'){o.w=o.h=s}else if(o.type==='ramp')o.w=s;updatePanel()}
function duplicateSelected(){if(mode!=='edit'||selected<0)return;const n=JSON.parse(JSON.stringify(objects[selected]));n.x+=35;n.y+=20;objects.push(n);selected=objects.length-1;updatePanel()}
function deleteSelected(){if(mode!=='edit'||selected<0)return;objects.splice(selected,1);selected=-1;updatePanel()}

function startTest(){if(mode==='test')return;if(!objects.length){alert('先摆放一些对象');return}mode='test';selected=-1;updatePanel();document.getElementById('modeBadge').textContent='物理测试';document.getElementById('modeBadge').style.background='#713333';engine=Matter.Engine.create();engine.gravity.y=1;bodies=objects.map((o,i)=>{let b;if(o.type==='ball')b=Matter.Bodies.circle(o.x,o.y,o.radius,{density:.002,restitution:.25,friction:.4});else if(o.type==='ramp')b=Matter.Bodies.rectangle(o.x,o.y,o.w,o.h,{isStatic:true,angle:o.r*Math.PI/180,friction:.9});else b=Matter.Bodies.rectangle(o.x,o.y,o.w,o.h,{density:o.type==='domino'?.0025:.004,friction:.7,restitution:.05,angle:o.r*Math.PI/180});b.plugin={editorIndex:i};return b});ground=Matter.Bodies.rectangle(innerWidth/2,innerHeight-18,innerWidth+200,36,{isStatic:true,friction:1});Matter.Composite.add(engine.world,[...bodies,ground])}
function stopTest(){if(mode!=='test')return;mode='edit';engine=null;bodies=[];ground=null;document.getElementById('modeBadge').textContent='编辑模式';document.getElementById('modeBadge').style.background='#244b2c'}
function pushFirst(){if(mode!=='test'){startTest();setTimeout(pushFirst,0);return}const idx=objects.findIndex(o=>o.type==='domino');if(idx<0)return;const b=bodies[idx];Matter.Body.applyForce(b,{x:b.position.x,y:b.position.y-35},{x:.018,y:0});Matter.Body.setAngularVelocity(b,.05)}

function physicsStep(){if(mode==='test'&&engine){Matter.Engine.update(engine,1000/60)}requestAnimationFrame(physicsStep)}requestAnimationFrame(physicsStep);

function serialize(){return{version:6,canvas:{width:innerWidth,height:innerHeight},objects:objects.map(o=>({...o}))}}
function saveLevel(){localStorage.setItem('dominoEditorV6',JSON.stringify(serialize()));alert('关卡已保存到浏览器')}
function loadLevel(){if(mode==='test')stopTest();const raw=localStorage.getItem('dominoEditorV6');if(!raw){alert('没有找到存档');return}try{const data=JSON.parse(raw);objects=(data.objects||[]).map(o=>({...o}));selected=-1;updatePanel()}catch(err){alert('存档格式错误')}}
function exportLevel(){const text=JSON.stringify(serialize(),null,2);const blob=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='domino-level.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function clearAll(){if(mode==='test')stopTest();objects=[];selected=-1;updatePanel()}

for(let i=0;i<12;i++)objects.push(makeObject('domino',320+i*38,innerHeight-88));
const ramp=makeObject('ramp',220,innerHeight-150);ramp.r=-14;objects.push(ramp);
const ball=makeObject('ball',145,innerHeight-225);objects.push(ball);
</script>
</body></html>
