<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Editor V13</title><style>body{margin:0;background:#181818;color:white;font-family:Arial;overflow:hidden}#ui,#panel{position:fixed;background:#333;padding:12px;border-radius:8px;z-index:5}#ui{top:10px;left:10px}#panel{right:10px;top:10px}button{padding:7px;margin:2px}canvas{background:#222}</style></head><body><div id='ui'><b>Domino Editor V13</b><br><button onclick="add('domino')">多米诺</button><button onclick="add('ball')">球</button><button onclick="add('switch')">开关</button><button onclick="add('door')">门</button><button onclick="test()">测试</button><button onclick="save()">保存</button><button onclick="load()">读取</button></div><div id='panel'>可视化编辑器<br>拖动 | 框选 | 旋转 | 删除</div><canvas id='c'></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let objs=[],links=[],sel=[],drag=false,box=null;function add(type){objs.push({type,x:300+objs.length*40,y:300,r:0})}function draw(){ctx.clearRect(0,0,c.width,c.height);links.forEach(l=>{ctx.strokeStyle='#0f0';ctx.beginPath();ctx.moveTo(l.a.x,l.a.y);ctx.lineTo(l.b.x,l.b.y);ctx.stroke()});objs.forEach((o,i)=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r);ctx.fillStyle=sel.includes(i)?'#ffd43b':o.type==='ball'?'#55aaff':o.type==='switch'?'#55ff55':o.type==='door'?'#ff5555':'#eee';ctx.fillRect(-15,-35,30,70);ctx.restore()});if(box){ctx.strokeStyle='#fff';ctx.strokeRect(box.x,box.y,box.w,box.h)}requestAnimationFrame(draw)}draw();function hit(x,y){for(let i=objs.length-1;i>=0;i--){if(Math.abs(objs[i].x-x)<30&&Math.abs(objs[i].y-y)<50)return i}return -1}c.onmousedown=e=>{let i=hit(e.clientX,e.clientY);if(i>=0){sel=[i];drag=true}else box={x:e.clientX,y:e.clientY,w:0,h:0}};c.onmousemove=e=>{if(drag&&sel.length){objs[sel[0]].x=e.clientX;objs[sel[0]].y=e.clientY}if(box){box.w=e.clientX-box.x;box.h=e.clientY-box.y}};c.onmouseup=e=>{drag=false;if(box){sel=[];objs.forEach((o,i)=>{if(o.x>box.x&&o.x<box.x+box.w&&o.y>box.y&&o.y<box.y+box.h)sel.push(i)});box=null}};c.onwheel=e=>sel.forEach(i=>objs[i].r+=e.deltaY>0?.1:-.1);onkeydown=e=>{if(e.key==='Delete'){objs=objs.filter((_,i)=>!sel.includes(i));sel=[]}};function test(){alert('进入物理测试模式')}function save(){localStorage.v13=JSON.stringify({objects:objs,links:links})}function load(){let d=JSON.parse(localStorage.v13||'{}');objs=d.objects||[];links=d.links||[]}</script></body></html>
