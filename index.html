<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Domino Editor V4</title><style>body{margin:0;background:#202020;color:white;overflow:hidden;font-family:Arial}#ui{position:fixed;top:10px;left:10px;z-index:5}#panel{position:fixed;right:10px;top:10px;width:220px;background:#333;padding:15px;border-radius:8px}button{margin:2px;padding:7px}canvas{background:linear-gradient(#333 1px,transparent 1px),linear-gradient(90deg,#333 1px,transparent 1px);background-size:40px 40px}</style></head><body><div id="ui"><button onclick="add('normal')">普通牌</button><button onclick="add('bomb')">炸弹牌</button><button onclick="add('speed')">加速牌</button><button onclick="circle()">圆阵</button><button onclick="save()">保存</button><button onclick="load()">读取</button><button onclick="run()">测试</button></div><div id="panel">未选择<br><br>点击牌查看属性</div><canvas id="c"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let ds=[],sel=null,drag=false;
class D{constructor(x,y,t){this.x=x;this.y=y;this.r=0;this.f=0;this.type=t;this.target=0}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.r+this.f);ctx.fillStyle=this===sel?'#ffcc00':this.type==='bomb'?'#f55':this.type==='speed'?'#5cf':'#eee';ctx.beginPath();ctx.roundRect(-12,-40,24,80,5);ctx.fill();ctx.restore()}update(){this.f+=(this.target-this.f)*.1}}
function add(t){ds.push(new D(300,300,t))}function select(d){sel=d;document.getElementById('panel').innerHTML=`类型:${d.type}<br>X:${d.x}<br>Y:${d.y}<br>角度:${d.r.toFixed(2)}`}function hit(x,y){return ds.find(d=>Math.hypot(x-d.x,y-d.y)<50)}c.onmousedown=e=>{sel=hit(e.clientX,e.clientY);if(sel)select(sel);drag=!!sel};c.onmousemove=e=>{if(drag){sel.x=Math.round(e.clientX/20)*20;sel.y=Math.round(e.clientY/20)*20}};c.onmouseup=()=>drag=false;c.onwheel=e=>{if(sel)sel.r+=e.deltaY>0?.15:-.15};document.onkeydown=e=>{if(e.key==='Delete'&&sel){ds.splice(ds.indexOf(sel),1);sel=null}}
function circle(){for(let i=0;i<30;i++){let a=i*Math.PI*2/30;let d=new D(600+Math.cos(a)*220,350+Math.sin(a)*220,'normal');d.r=a;ds.push(d)}}function save(){localStorage.level=JSON.stringify(ds)}function load(){ds=JSON.parse(localStorage.level||'[]').map(o=>Object.assign(new D(),o))}function run(){ds.forEach((d,i)=>setTimeout(()=>d.target=Math.PI/2,i*80))}function loop(){ctx.clearRect(0,0,c.width,c.height);ds.forEach(d=>{d.update();d.draw()});requestAnimationFrame(loop)}loop();</script></body></html>
