<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Domino Editor V14</title><style>body{margin:0;background:#181818;color:#fff;font-family:Arial;overflow:hidden}#ui,#panel{position:fixed;z-index:5;background:#333;padding:12px;border-radius:8px}#ui{top:10px;left:10px}#panel{top:10px;right:10px}button{padding:7px;margin:2px}canvas{background:#222}</style></head><body><div id='ui'><b>Domino Editor V14</b><br><button onclick="add('domino')">多米诺</button><button onclick="add('ball')">球</button><button onclick="add('switch')">开关</button><button onclick="add('door')">门</button><button onclick="add('bomb')">炸弹</button><br><button onclick="connectMode()">连接模式</button><button onclick="normalMode()">编辑模式</button><button onclick="test()">测试</button><button onclick="save()">保存</button></div><div id='panel'>V14 机关连线编辑器<br><span id='msg'>编辑对象</span><br>拖动对象<br>连接模式: 点击两个机关</div><canvas id='c'></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let objs=[],links=[],sel=-1,drag=false,mode='edit',linkStart=-1;function add(type){objs.push({type,x:300+objs.length*45,y:300,r:0,active:false})}function color(t){return t==='ball'?'#55aaff':t==='switch'?'#55ff55':t==='door'?'#ff5555':t==='bomb'?'#ff9900':'#eee'}function draw(){ctx.clearRect(0,0,c.width,c.height);links.forEach(l=>{ctx.strokeStyle='#00ff99';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l.a.x,l.a.y);ctx.lineTo(l.b.x,l.b.y);ctx.stroke();ctx.fillStyle='#00ff99';ctx.fillText('触发',((l.a.x+l.b.x)/2),((l.a.y+l.b.y)/2))});objs.forEach((o,i)=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r);ctx.fillStyle=i===sel?'#ffd43b':color(o.type);ctx.fillRect(-18,-35,36,70);ctx.fillStyle='#000';ctx.fillText(o.type, -20,50);ctx.restore()});requestAnimationFrame(draw)}draw();function hit(x,y){for(let i=objs.length-1;i>=0;i--)if(Math.abs(objs[i].x-x)<35&&Math.abs(objs[i].y-y)<55)return i;return -1}c.onmousedown=e=>{let i=hit(e.clientX,e.clientY);if(mode==='connect'){if(i>=0){if(linkStart<0){linkStart=i;msg.innerHTML='选择目标'}else{if(linkStart!==i)links.push({a:objs[linkStart],b:objs[i]});linkStart=-1;msg.innerHTML='连接完成'}}return}sel=i;drag=i>=0};c.onmousemove=e=>{if(drag&&sel>=0){objs[sel].x=e.clientX;objs[sel].y=e.clientY}};c.onmouseup=()=>drag=false;c.onwheel=e=>{if(sel>=0)objs[sel].r+=e.deltaY>0?.1:-.1};onkeydown=e=>{if(e.key==='Delete'&&sel>=0){objs.splice(sel,1);sel=-1}};function connectMode(){mode='connect';msg.innerHTML='连接模式'}function normalMode(){mode='edit';msg.innerHTML='编辑对象'}function test(){mode='test';msg.innerHTML='测试: 根据连接触发机关'}function save(){localStorage.v14=JSON.stringify({objects:objs,links:links.map(l=>({a:objs.indexOf(l.a),b:objs.indexOf(l.b)}))});alert('V14关卡保存')}function load(){let d=JSON.parse(localStorage.v14||'{}');objs=d.objects||[];links=(d.links||[]).map(l=>({a:objs[l.a],b:objs[l.b]}))}</script></body></html>
